name: Godmode
version: '1.0.0.0'
main: io.github.derexxd.godmode.Godmode
api-version: '1.18'
prefix: DerexXD
authors: [ DerexXD ]
description: Lightweight, performant plugin for godmode
website: https://www.derekchen.dev/

commands:
  godmode:
    description: Toggle godmode for a player
    usage: /godmode <player>
    permission: godmode.admin

permissions:
  godmode.admin:
    default: op
